<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AniLiberty Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff;
    overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  #player { position: fixed; inset: 0; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

  #ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .25s; }
  #ui.hidden { opacity: 0; }

  /* Top bar — padding also accounts for Telegram's own chrome (close button) */
  #top { position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + var(--tgTop,0px) + 10px)
             calc(env(safe-area-inset-right) + var(--tgRight,0px) + 14px) 30px
             calc(env(safe-area-inset-left) + var(--tgLeft,0px) + 14px);
    background: linear-gradient(180deg, rgba(0,0,0,.78), rgba(0,0,0,0));
    display: flex; align-items: flex-start; gap: 10px; pointer-events: auto; }
  #title { flex: 1; font-size: 14px; font-weight: 600; line-height: 1.3; padding-top: 8px;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .icon { flex: none; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(40,40,40,.6); border: none; color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .icon:active { background: rgba(90,90,90,.85); }

  /* Center prev/next */
  #center { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: space-between;
    padding-left: calc(env(safe-area-inset-left) + 28px);
    padding-right: calc(env(safe-area-inset-right) + 28px); pointer-events: none; }
  .nav { pointer-events: auto; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(30,30,30,.45); border: none; color: #fff; font-size: 25px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .nav:disabled { opacity: .2; pointer-events: none; }
  .nav:active { background: rgba(80,80,80,.85); }

  /* Quality panel */
  #settings { position: absolute; right: calc(env(safe-area-inset-right) + var(--tgRight,0px) + 12px); top: calc(env(safe-area-inset-top) + var(--tgTop,0px) + 60px);
    background: rgba(28,28,30,.97); border-radius: 14px; padding: 6px; min-width: 150px;
    pointer-events: auto; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 5; }
  #settings.open { display: block; }
  #settings .hd { font-size: 12px; opacity: .6; padding: 6px 12px 4px; }
  .qrow { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-radius: 9px; cursor: pointer; font-size: 15px; }
  .qrow:active { background: rgba(255,255,255,.08); }
  .qrow .check { width: 16px; opacity: 0; }
  .qrow.active .check { opacity: 1; color: #3390ec; }
  .qrow.active { color: #3390ec; }

  /* Playlist panel */
  #playlist { position: absolute; right: calc(env(safe-area-inset-right) + var(--tgRight,0px) + 12px); top: calc(env(safe-area-inset-top) + var(--tgTop,0px) + 60px);
    background: rgba(28,28,30,.97); border-radius: 14px; padding: 6px; min-width: 210px;
    max-height: 60vh; overflow-y: auto; pointer-events: auto; display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 6; -webkit-overflow-scrolling: touch; }
  #playlist.open { display: block; }
  #playlist .hd { font-size: 12px; opacity: .6; padding: 6px 12px 4px; position: sticky; top: 0;
    background: rgba(28,28,30,.97); }
  .eprow { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 9px;
    cursor: pointer; font-size: 15px; }
  .eprow:active { background: rgba(255,255,255,.08); }
  .eprow .mark { width: 18px; text-align: center; color: #4caf50; opacity: 0; }
  .eprow.seen .mark { opacity: 1; }
  .eprow.seen .nm { opacity: .6; }
  .eprow.cur { color: #3390ec; }
  .eprow.cur .mark { color: #3390ec; }

  /* Bottom control bar */
  #bottom { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 30px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
    background: linear-gradient(0deg, rgba(0,0,0,.82), rgba(0,0,0,0));
    pointer-events: auto; }
  #row { display: flex; align-items: center; gap: 12px; }
  .cbtn { flex: none; width: 38px; height: 38px; border: none; background: transparent; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .cbtn svg { width: 24px; height: 24px; display: block; }
  .cbtn:active { opacity: .6; }
  .time { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .9; min-width: 42px; text-align: center; }

  /* Volume popup (appears above the volume button on tap) */
  #volpop { position: absolute; right: 56px; bottom: calc(env(safe-area-inset-bottom) + 70px);
    background: rgba(28,28,30,.97); border-radius: 12px; padding: 8px 12px;
    display: none; align-items: center; gap: 8px; pointer-events: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); z-index: 6; }
  #volpop.open { display: flex; }
  #vol { width: 130px; height: 30px; cursor: pointer; accent-color: #3390ec; }

  /* Custom seekbar with big touch area */
  #seek { position: relative; flex: 1; height: 38px; cursor: pointer; touch-action: none; }
  #seek .track { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); }
  #seek .buf { position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    height: 5px; border-radius: 3px; background: rgba(255,255,255,.4); width: 0; }
  #seek .fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    height: 5px; border-radius: 3px; background: #3390ec; width: 0; }
  #seek .thumb { position: absolute; top: 50%; left: 0; width: 15px; height: 15px; border-radius: 50%;
    background: #3390ec; transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(51,144,236,.25); }

  /* Skip opening / ending */
  #skip, #skipEnd { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 96px);
    background: rgba(20,20,20,.8); color: #fff; border: 1px solid rgba(255,255,255,.28);
    border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    pointer-events: auto; display: none; backdrop-filter: blur(6px); z-index: 4; }
  #skip.show, #skipEnd.show { display: block; }
  #skip:active, #skipEnd:active { background: rgba(60,60,60,.9); }

  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px; font-size: 15px; pointer-events: none; }
  #msg.hidden { display: none; }
  .spin { width: 40px; height: 40px; border: 3px solid #444; border-top-color: #3390ec; border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="player">
  <video id="v" playsinline webkit-playsinline></video>

  <div id="ui">
    <div id="top">
      <div id="title">Загрузка…</div>
      <button class="icon" id="list" title="Серии">☰</button>
      <button class="icon" id="gear" title="Качество">⚙</button>
    </div>
    <div id="center">
      <button class="nav" id="prev" title="Предыдущая">‹</button>
      <button class="nav" id="next" title="Следующая">›</button>
    </div>
    <div id="settings"><div class="hd">Качество</div><div id="qlist"></div></div>
    <div id="playlist"><div class="hd">Серии</div><div id="eplist"></div></div>

    <div id="bottom">
      <div id="row">
        <button class="cbtn" id="playpause"></button>
        <span class="time" id="cur">0:00</span>
        <div id="seek">
          <div class="track"></div><div class="buf"></div><div class="fill"></div><div class="thumb"></div>
        </div>
        <span class="time" id="dur">0:00</span>
        <button class="cbtn" id="mute"></button>
        <button class="cbtn" id="fs"></button>
      </div>
      <div id="volpop">
        <button class="cbtn" id="muteToggle"></button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </div>

  <button id="skip">Пропустить опенинг</button>
  <button id="skipEnd">Пропустить эндинг</button>
  <div id="msg"><div class="spin"></div><div id="msgtext">Получаю серию…</div></div>
</div>

<script>
(function () {
  const API = "https://anilibria.top/api/v1/anime/releases/";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#000000"); } catch (e) {} }

  // Keep our top-right buttons clear of Telegram's own chrome (close button, header)
  function applyInsets(){
    if (!tg) return;
    const a = tg.contentSafeAreaInset || {top:0,right:0,left:0};
    const b = tg.safeAreaInset || {top:0,right:0,left:0};
    const r = document.documentElement.style;
    r.setProperty("--tgTop",   ((a.top||0)+(b.top||0)) + "px");
    r.setProperty("--tgRight", ((a.right||0)+(b.right||0)) + "px");
    r.setProperty("--tgLeft",  ((a.left||0)+(b.left||0)) + "px");
  }
  if (tg && tg.onEvent) {
    applyInsets();
    ["safeAreaChanged","contentSafeAreaChanged","fullscreenChanged","viewportChanged"].forEach(ev => {
      try { tg.onEvent(ev, applyInsets); } catch(e){}
    });
  }

  // iOS blocks programmatic volume (HTMLMediaElement.volume is read-only there) — only mute works
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  const params = new URLSearchParams(location.search);
  const rid = params.get("rid");
  let curOrd = parseFloat(params.get("ep"));
  const apiBase = params.get("api");  // bot backend (cloudflared tunnel) for progress sync

  const $ = id => document.getElementById(id);
  const player=$("player"), video=$("v"), ui=$("ui"), titleEl=$("title"), msg=$("msg"), msgText=$("msgtext");
  const gear=$("gear"), settings=$("settings"), qlist=$("qlist"), prevBtn=$("prev"), nextBtn=$("next"), skipBtn=$("skip");
  const playpause=$("playpause"), curEl=$("cur"), durEl=$("dur"), muteBtn=$("mute"), fsBtn=$("fs"), volEl=$("vol");
  const volpop=$("volpop"), muteToggle=$("muteToggle");
  const listBtn=$("list"), playlist=$("playlist"), eplist=$("eplist"), skipEndBtn=$("skipEnd");

  // SVG icons
  const ICON = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    vol:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
    volLow:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>',
    mute:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
    fsOn:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
    fsOff: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>',
  };
  const seek=$("seek"), fill=seek.querySelector(".fill"), buf=seek.querySelector(".buf"), thumb=seek.querySelector(".thumb");

  let hls=null, releaseName="Аниме", episodes=[], sources={}, curQuality=null, curOpening=null, curEnding=null;
  const posKey = ord => "alib_pos_" + rid + "_" + ord;
  const watchedKey = "alib_watched_" + rid;
  // The bot backend is the source of truth (cross-device). localStorage is a mirror /
  // offline cache; serverWatched + serverPos are pulled on open via /api/state.
  const serverWatched = new Set();
  let serverPos = {};                       // { "<ordinal>": seconds }
  function getLocalWatched(){ try { return new Set(JSON.parse(localStorage.getItem(watchedKey) || "[]")); } catch(e){ return new Set(); } }
  function getWatched(){ const s = getLocalWatched(); serverWatched.forEach(o => s.add(o)); return s; }  // union for ✓
  function apiUrl(path){ return apiBase ? apiBase.replace(/\/$/,"") + path : null; }
  function apiPost(path, payload){
    const u = apiUrl(path); if(!u || !tg || !tg.initData) return Promise.resolve(null);
    return fetch(u, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(Object.assign({ init_data: tg.initData, release_id: Number(rid) }, payload)),
    }).catch(()=>null);
  }
  function reportWatched(ord){ apiPost("/api/watched", { episode: ord }); }
  function syncAllWatched(){ const arr=[...getLocalWatched()]; if(arr.length) apiPost("/api/watched", { watched: arr }); }
  function postPosition(ord, pos){ apiPost("/api/position", { episode: ord, position: Math.floor(pos||0) }); }
  function markWatched(ord){
    if(getWatched().has(ord)) return;       // already known locally or on the server
    const s=getLocalWatched(); s.add(ord); localStorage.setItem(watchedKey, JSON.stringify([...s]));
    serverWatched.add(ord); buildPlaylist(); reportWatched(ord);
  }
  // Pull watched ✓ + resume positions from the backend so they follow the user across
  // devices (and survive Telegram clearing the Mini App's localStorage).
  async function loadServerState(){
    const r = await apiPost("/api/state", {});
    if(!r) return;
    let d; try { d = await r.json(); } catch(e){ return; }
    if(!d || !d.ok) return;
    (d.watched || []).forEach(o => serverWatched.add(parseFloat(o)));
    serverPos = {};
    (d.positions || []).forEach(p => { serverPos[String(parseFloat(p[0]))] = parseFloat(p[1]); });
    // mirror server ✓ into localStorage so they persist and re-sync later
    const s = getLocalWatched(); let ch=false;
    serverWatched.forEach(o => { if(!s.has(o)){ s.add(o); ch=true; } });
    if(ch) localStorage.setItem(watchedKey, JSON.stringify([...s]));
  }
  const fmtT = s => { s=Math.floor(s||0); const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); };

  function showMsg(t,sp){ msg.classList.remove("hidden"); msg.querySelector(".spin").style.display=sp?"block":"none"; msgText.textContent=t; }
  function hideMsg(){ msg.classList.add("hidden"); }

  // overlay auto-hide
  let hideTimer=null;
  function showUI(){ ui.classList.remove("hidden"); clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{ if(!video.paused){ ui.classList.add("hidden"); settings.classList.remove("open"); playlist.classList.remove("open"); volpop.classList.remove("open"); } },3500); }
  function anyPanelOpen(){ return settings.classList.contains("open")||playlist.classList.contains("open")||volpop.classList.contains("open"); }
  function closePanels(){ settings.classList.remove("open"); playlist.classList.remove("open"); volpop.classList.remove("open"); }

  let suppressClick=false;
  player.addEventListener("pointerdown", e=>{
    const onPanel  = e.target.closest("#settings")||e.target.closest("#playlist")||e.target.closest("#volpop");
    const onToggle = e.target.closest("#gear")||e.target.closest("#list")||e.target.closest("#mute");
    // A tap/click outside the panels closes any open panel.
    // Only suppress the follow-up play-toggle when the tap landed on the video itself.
    if(anyPanelOpen() && !onPanel && !onToggle){ closePanels(); if(e.target===video) suppressClick=true; }
    if(e.target.closest("button")||onPanel||e.target.closest("#seek")) return;
    showUI();
  });
  function togglePlay(){ if(video.paused) video.play().catch(()=>{}); else video.pause(); showUI(); }
  // Tap on the video toggles play/pause (unless that tap just dismissed a panel)
  video.addEventListener("click", ()=>{ if(suppressClick){ suppressClick=false; return; } togglePlay(); });
  video.addEventListener("pause", ()=>{ playpause.innerHTML=ICON.play; showUI(); });
  video.addEventListener("play",  ()=>{ playpause.innerHTML=ICON.pause; showUI(); });

  // playback
  function play(url, startAt){
    if(hls){ hls.destroy(); hls=null; }
    const seekTo=()=>{ if(startAt&&startAt>1){ try{ video.currentTime=startAt; }catch(e){} } video.play().catch(()=>{}); };
    if(window.Hls && Hls.isSupported()){
      hls=new Hls({maxBufferLength:30}); hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, seekTo);
      hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal) showMsg("Ошибка потока. Смените качество.",false); });
    } else if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src=url; video.addEventListener("loadedmetadata", seekTo, {once:true});
    } else showMsg("Браузер не поддерживает HLS.",false);
  }
  function setQuality(q,startAt){ if(!sources[q])return; curQuality=q; buildQ(); settings.classList.remove("open"); play(sources[q],startAt); }
  function buildQ(){ qlist.innerHTML=""; ["1080","720","480"].forEach(q=>{ if(!sources[q])return;
    const r=document.createElement("div"); r.className="qrow"+(q===curQuality?" active":"");
    r.innerHTML='<span class="check">✓</span><span>'+q+'p</span>'; r.onclick=()=>setQuality(q,video.currentTime); qlist.appendChild(r); }); }
  gear.onclick=()=>{ playlist.classList.remove("open"); settings.classList.toggle("open"); showUI(); };
  listBtn.onclick=()=>{ settings.classList.remove("open"); playlist.classList.toggle("open"); showUI(); };

  function buildPlaylist(){
    const seen=getWatched(); eplist.innerHTML="";
    episodes.forEach(e=>{
      const ord=parseFloat(e.ordinal);
      const row=document.createElement("div");
      row.className="eprow"+(ord===curOrd?" cur":"")+(seen.has(ord)?" seen":"");
      row.innerHTML='<span class="mark">✓</span><span class="nm">Серия '+ord+(e.name?" — "+e.name:"")+'</span>';
      row.onclick=()=>{ playlist.classList.remove("open"); loadEpisode(ord,true); };
      eplist.appendChild(row);
    });
  }

  // play/pause
  playpause.onclick=togglePlay;
  playpause.innerHTML=ICON.play;

  // volume — tap speaker opens a slider popup; toggle button mutes
  function renderVolIcon(){
    const ic = (video.muted||video.volume===0) ? ICON.mute : (video.volume<0.5 ? ICON.volLow : ICON.vol);
    muteBtn.innerHTML=ic; muteToggle.innerHTML=ic;
  }
  // iOS controls volume via hardware buttons / its native player — hide the web volume button there
  if(isIOS){ muteBtn.style.display="none"; }
  muteBtn.onclick=()=>{ settings.classList.remove("open"); playlist.classList.remove("open"); volpop.classList.toggle("open"); showUI(); };
  muteToggle.onclick=()=>{ video.muted=!video.muted; if(!video.muted && video.volume===0) video.volume=0.5; showUI(); };
  volEl.addEventListener("input", ()=>{ video.muted=false; video.volume=parseFloat(volEl.value); showUI(); });
  video.addEventListener("volumechange", ()=>{ volEl.value=video.muted?0:video.volume; renderVolIcon(); });
  renderVolIcon();

  // fullscreen — Telegram API first, then DOM Fullscreen, then iOS native
  fsBtn.innerHTML=ICON.fsOff;
  function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||(tg&&tg.isFullscreen)); }
  function syncFsIcon(){ fsBtn.innerHTML=isFS()?ICON.fsOn:ICON.fsOff; }
  document.addEventListener("fullscreenchange", syncFsIcon);
  document.addEventListener("webkitfullscreenchange", syncFsIcon);
  const isIOSNative = (typeof video.webkitEnterFullscreen === "function" && !window.HTMLVideoElement.prototype.requestFullscreen);
  function enterFullscreen(){
    // iOS: hand off to the native player (its own controls — no Mini App overlap)
    if (typeof video.webkitEnterFullscreen === "function" && isIOSNative) {
      try { video.webkitEnterFullscreen(); return; } catch(e){}
    }
    try {
      if (tg && typeof tg.requestFullscreen==="function" && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) {
        tg.requestFullscreen(); return;
      }
    } catch(e){}
    const el=player;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{ if(video.webkitEnterFullscreen) video.webkitEnterFullscreen(); });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  }
  function exitFullscreen(){
    try { if (tg && tg.isFullscreen && tg.exitFullscreen) { tg.exitFullscreen(); return; } } catch(e){}
    const d=document;
    if (d.fullscreenElement && d.exitFullscreen) d.exitFullscreen();
    else if (d.webkitFullscreenElement && d.webkitExitFullscreen) d.webkitExitFullscreen();
  }
  fsBtn.onclick=()=>{ showUI(); if (isFS()) exitFullscreen(); else enterFullscreen(); setTimeout(syncFsIcon, 300); };
  if (tg && tg.onEvent) { try { tg.onEvent("fullscreenChanged", syncFsIcon); } catch(e){} }

  // Desktop: mouse movement reveals controls; keyboard shortcuts
  document.addEventListener("mousemove", showUI);
  document.addEventListener("keydown", e=>{
    if (e.code==="Space")      { e.preventDefault(); togglePlay(); }
    else if (e.code==="KeyF")  { fsBtn.click(); }
    else if (e.code==="Escape"){ if (isFS()) exitFullscreen(); }
    else if (e.code==="ArrowRight"){ if(video.duration) video.currentTime=Math.min(video.duration, video.currentTime+10); showUI(); }
    else if (e.code==="ArrowLeft") { video.currentTime=Math.max(0, video.currentTime-10); showUI(); }
    else if (e.code==="ArrowUp")   { video.muted=false; video.volume=Math.min(1, (video.volume||0)+0.1); showUI(); }
    else if (e.code==="ArrowDown") { video.muted=false; video.volume=Math.max(0, (video.volume||0)-0.1); showUI(); }
  });

  // seekbar
  let scrubbing=false;
  function setProgress(ratio){ ratio=Math.min(1,Math.max(0,ratio||0)); const p=(ratio*100)+"%"; fill.style.width=p; thumb.style.left=p; }
  function ratioFromEvent(e){ const r=seek.getBoundingClientRect(); return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); }
  seek.addEventListener("pointerdown", e=>{ scrubbing=true; seek.setPointerCapture(e.pointerId);
    const r=ratioFromEvent(e); setProgress(r); curEl.textContent=fmtT(r*(video.duration||0)); showUI(); });
  seek.addEventListener("pointermove", e=>{ if(!scrubbing)return; const r=ratioFromEvent(e); setProgress(r); curEl.textContent=fmtT(r*(video.duration||0)); });
  seek.addEventListener("pointerup", e=>{ if(!scrubbing)return; scrubbing=false; const r=ratioFromEvent(e); if(video.duration) video.currentTime=r*video.duration; showUI(); });

  // resume + skip-opening + progress
  let lastSave=0, lastServerSave=0;
  video.addEventListener("loadedmetadata", ()=>{ durEl.textContent=fmtT(video.duration); });
  video.addEventListener("progress", ()=>{ try{ if(video.buffered.length&&video.duration){ buf.style.width=(video.buffered.end(video.buffered.length-1)/video.duration*100)+"%"; } }catch(e){} });
  video.addEventListener("timeupdate", ()=>{
    const t=video.currentTime||0;
    if(!scrubbing){ if(video.duration){ setProgress(t/video.duration); curEl.textContent=fmtT(t); } }
    if(t>5 && video.duration && t<video.duration-5){
      if(Math.abs(t-lastSave)>4){ lastSave=t; localStorage.setItem(posKey(curOrd),String(t)); }
      if(t-lastServerSave>15){ lastServerSave=t; postPosition(curOrd,t); }   // resume point → DB
    }
    if(curOpening && t>=curOpening.start && t<curOpening.stop-0.5) skipBtn.classList.add("show"); else skipBtn.classList.remove("show");
    // Show "skip ending" while inside the ending interval (until just before its end, so post-credit scenes remain)
    if(curEnding && curEnding.stop!=null && t>=curEnding.start && t<curEnding.stop-0.5) skipEndBtn.classList.add("show"); else skipEndBtn.classList.remove("show");
    checkWatched();
  });
  // Mark watched 5s before the ending begins (so it counts even if you stop right
  // before the ED). If the episode has no ending metadata, fall back to the last 5s.
  function checkWatched(){
    const t=video.currentTime||0, d=video.duration||0;
    if(!d) return;
    if(curEnding && curEnding.start!=null){ if(t>=curEnding.start-5) markWatched(curOrd); }
    else if(t>=d-5){ markWatched(curOrd); }
  }
  video.addEventListener("seeked", checkWatched);
  skipBtn.onclick=()=>{ if(curOpening){ video.currentTime=curOpening.stop; skipBtn.classList.remove("show"); } };
  skipEndBtn.onclick=()=>{ if(!curEnding) return; markWatched(curOrd); skipEndBtn.classList.remove("show");
    // If there is content after the ending — jump to its end; otherwise go to next episode
    if(video.duration && curEnding.stop < video.duration-1){ video.currentTime=curEnding.stop; }
    else { const i=curIndex(); if(i>=0&&i<episodes.length-1) loadEpisode(parseFloat(episodes[i+1].ordinal),true); }
  };

  // episodes
  function curIndex(){ return episodes.findIndex(e=>parseFloat(e.ordinal)===curOrd); }
  function updateNav(){ const i=curIndex(); prevBtn.disabled=i<=0; nextBtn.disabled=i<0||i>=episodes.length-1; }
  function loadEpisode(ordinal, keepQ){
    const e=episodes.find(x=>parseFloat(x.ordinal)===ordinal); if(!e){ showMsg("Серия не найдена.",false); return; }
    curOrd=ordinal; sources={};
    if(e.hls_480) sources["480"]=e.hls_480; if(e.hls_720) sources["720"]=e.hls_720; if(e.hls_1080) sources["1080"]=e.hls_1080;
    curOpening=(e.opening&&e.opening.start!=null&&e.opening.stop!=null)?e.opening:null; skipBtn.classList.remove("show");
    curEnding=(e.ending&&e.ending.start!=null)?e.ending:null; skipEndBtn.classList.remove("show");
    titleEl.textContent=releaseName+" · Серия "+ordinal+(e.name?" — "+e.name:"");
    history.replaceState(null,"","?rid="+rid+"&ep="+ordinal);
    setProgress(0); curEl.textContent="0:00"; buf.style.width="0";
    const q=(keepQ&&sources[curQuality])?curQuality:(sources["720"]?"720":(sources["480"]?"480":"1080"));
    if(!sources[q]){ showMsg("Нет доступных потоков.",false); return; }
    const localPos=parseFloat(localStorage.getItem(posKey(ordinal)))||0;
    const srvPos=serverPos[String(ordinal)]||0;
    const saved=Math.max(localPos, srvPos);   // resume from the furthest point, any device
    hideMsg(); updateNav(); buildPlaylist(); lastSave=saved; lastServerSave=saved; setQuality(q,saved); showUI();
  }
  prevBtn.onclick=()=>{ const i=curIndex(); if(i>0) loadEpisode(parseFloat(episodes[i-1].ordinal),true); };
  nextBtn.onclick=()=>{ const i=curIndex(); if(i>=0&&i<episodes.length-1) loadEpisode(parseFloat(episodes[i+1].ordinal),true); };
  video.addEventListener("ended", ()=>{ markWatched(curOrd); localStorage.removeItem(posKey(curOrd)); postPosition(curOrd,0);
    const i=curIndex(); if(i>=0&&i<episodes.length-1) loadEpisode(parseFloat(episodes[i+1].ordinal),true); });

  // Flush the resume position to the backend on pause / when the player is hidden, so a
  // half-watched episode resumes correctly on another device even without reaching 15s tick.
  function flushPosition(){ const t=video.currentTime||0; if(t>5&&video.duration&&t<video.duration-5){ lastServerSave=t; postPosition(curOrd,t); } }
  video.addEventListener("pause", flushPosition);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushPosition(); });
  window.addEventListener("pagehide", flushPosition);

  // init
  if(!rid||isNaN(curOrd)){ showMsg("Не указана серия.",false); return; }
  syncAllWatched();  // push any existing local ✓ marks to the bot on open
  // Pull server state (✓ + resume positions) and the catalog in parallel. The state
  // fetch is time-boxed so a dead/slow backend never blocks playback from starting.
  const withTimeout=(p,ms)=>Promise.race([p, new Promise(res=>setTimeout(()=>res(null),ms))]);
  Promise.all([
    withTimeout(loadServerState(), 4000),
    fetch(API+encodeURIComponent(rid)).then(r=>r.json()),
  ]).then(([_, data])=>{
    releaseName=(data.name&&data.name.main)||"Аниме";
    episodes=(data.episodes||[]).slice().sort((a,b)=>parseFloat(a.ordinal)-parseFloat(b.ordinal));
    if(!episodes.length){ showMsg("Серии недоступны.",false); return; }
    loadEpisode(curOrd,false);
  }).catch(()=>showMsg("Ошибка загрузки данных.",false));
})();
</script>
</body>
</html>
